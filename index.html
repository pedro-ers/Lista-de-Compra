<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi lista de la compra</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="encabezado">
        <img
            src="fotos/comida.jpg"
            alt="Montón de frutas frescas como bananas, manzanas, naranjas y fresas"
            class="imagen-frutas"
        >

        <div class="titulo-encabezado">
            <h1>Mi lista de la compra</h1>
            <p>Organiza tus compras, paso a paso</p>
        </div>
    </header>

    <main class="contenedor">
        
        <!-- novalidate: usamos validación propia para mostrar un mensaje accesible -->
        <form id="formulario-producto" novalidate>
            <label for="input-producto">Agregar un producto</label>

            <div class="grupo-entrada">
                <input
                    type="text"
                    id="input-producto"
                    placeholder="Escribe un producto"
                    autocomplete="off"
                    required
                    maxlength="80"
                    aria-describedby="error-producto"
                >

                <button type="submit">Agregar</button>
            </div>

            <!-- role="alert" hace que el error se anuncie en cuanto se muestra -->
            <p id="error-producto" class="mensaje-error" role="alert" hidden></p>
        </form>

        <section class="seccion-lista">
            <div class="barra-lista">
                <h2>Mi lista</h2>

                <button id="btn-ordenar" type="button">
                    Ordenar A-Z
                </button>
            </div>

            <!-- Contador visible y región viva: anuncia los cambios de la lista -->
            <p
                id="estado-lista"
                class="estado-lista"
                role="status"
                aria-live="polite"
                aria-atomic="true"
            ></p>

            <p id="mensaje-vacio">
                No hay productos en la lista. Agrega algunos productos para comenzar.
            </p>

            <ul id="lista-productos"></ul>
        </section>

    </main>

    <footer class="pie-pagina">
        <p>♥ ¡Buenas compras!</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
